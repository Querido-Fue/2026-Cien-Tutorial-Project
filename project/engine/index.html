<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Nth Player — Cien tutorial pixel game">
    <meta name="theme-color" content="#202020">
    <title>Nth Player</title>
    <link rel="stylesheet" type="text/css" href="./style.css">
    <link rel="icon" type="image/ico" href="../asset/old/icon/logo.ico">
    <script type="importmap">
    {
        "imports": {
            "engine/": "./script/",
            "core/": "./script/core/",
            "display/": "./script/display/",
            "scene/": "./script/scene/",
            "simulation/": "./script/simulation/",
            "ui/": "./script/ui/",
            "util/": "./script/util/",
            "animation/": "./script/animation/",
            "input/": "./script/input/",
            "sound/": "./script/sound/",
            "save/": "./script/save/",
            "data/": "./script/data/",
            "object/": "./script/object/",
            "debug/": "./script/debug/",
            "overlay/": "./script/overlay/"
        }
    }
    </script>
</head>

<body>
    <noscript>이 게임을 실행하려면 JavaScript를 활성화해야 합니다.</noscript>
    <canvas class="canvas" id="background"></canvas>
    <canvas class="canvas" id="object"></canvas>
    <canvas class="canvas" id="effect"></canvas>
    <canvas class="canvas" id="world-postprocess"></canvas>
    <canvas class="canvas" id="texteffect"></canvas>
    <canvas class="canvas" id="ui"></canvas>
    <div id="overlaylayerhost"></div>
    <canvas class="canvas" id="vignette"></canvas>
    <canvas class="canvas" id="top"></canvas>
    <div id="pointer-lock-focus-overlay" role="status" aria-live="polite" aria-hidden="true">
        <div class="pointer-lock-initial-copy">
            <span>화면을 클릭해주세요</span>
        </div>
        <div class="pointer-lock-focus-copy">
            <strong>일시 정지됨</strong>
            <span>화면을 클릭해 복귀</span>
        </div>
    </div>
    <div id="pointer-lock-exit-hint" role="status" aria-live="polite" aria-hidden="true">
        마우스 고정을 해제하려면 ESC키를 누르세요
    </div>
    <script type="module" src="./script/main.js"></script>
    <script type="module" src="./script/nw-setup.js"></script>
</body>

</html>
